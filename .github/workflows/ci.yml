name: CI Build & Test

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 21 LTS
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Compile and Package JAR
        run: |
          mkdir -p target/classes
          javac -d target/classes $(find src/main/java -name "*.java")
          jar --create --file target/filejanitor-cli.jar --main-class com.allday.filejanitor.FileJanitor -C target/classes .

      - name: Smoke Test Execution
        run: |
          java -jar target/filejanitor-cli.jar || true
